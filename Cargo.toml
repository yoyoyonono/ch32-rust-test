[package]
name = "ch32-rust-test"
version = "0.1.0"
edition = "2024"

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal", features = [
    "ch32v103r8t6",  
    "memory-x",
    "rt",
    "time-driver-tim2",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }
embassy-time = "0.5.1"
qingke-rt = "0.8"
qingke = "0.8"
panic-halt = "1.0"

[profile.release]
strip = false
lto = true
opt-level = "z"